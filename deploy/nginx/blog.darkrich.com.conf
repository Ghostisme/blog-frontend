# blog.darkrich.com 的 Nginx 站点配置（宿主机 Nginx）。
#
# 安装（只需做一次，之后前端发布不需要再动它）：
#   1. 【先签证书，再装本配置】本配置的 443 段引用了证书文件，证书不存在时 nginx -t 会直接失败。
#      签发不需要本配置：服务器上 00-acme.conf 是 80 端口的 default_server，
#      会把任何域名的 /.well-known/acme-challenge/ 映射到 /var/www/acme。前提是 DNS 已指向本机：
#        certbot certonly --webroot -w /var/www/acme -d blog.darkrich.com
#      成功后证书在 /etc/letsencrypt/live/blog.darkrich.com/，certbot 的定时续期会自动覆盖它。
#   2. 复制到 /etc/nginx/conf.d/blog.darkrich.com.conf
#   3. 核对两处是否与实际一致（默认值已按当前服务器填好）：
#      后端端口(BLOG_API_PORT，默认 18086)、静态文件根目录(Jenkins 参数 DEPLOY_DIR + /current)
#   4. nginx -t && systemctl reload nginx
#      nginx -t 失败时不要 reload，先看报错；通过了 reload 也不会中断其它站点。
#
# 适配版本：Nginx 1.24（Ubuntu 自带）。
#
# 不影响服务器上已有的站点：这里只声明 server_name 为 blog.darkrich.com 的虚拟主机，
# Nginx 按域名分发请求，其它域名的配置互不干扰。

server {
    listen 80;
    listen [::]:80;
    server_name blog.darkrich.com;

    # 与服务器上其它站点一致：证书验证文件统一放在 /var/www/acme。
    # 这里必须单独声明：本站的 server_name 比 00-acme.conf 里的 default_server 优先匹配，
    # 不写的话发往 blog.darkrich.com 的验证请求会落到下面的 301 跳转上。
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 写在 listen 里，而不是独立的 "http2 on;" 指令：后者 1.25.1 才有，
    # Ubuntu 自带的 1.24 遇到它会报 unknown directive 而无法启动。
    # 新版本 Nginx 上这种写法只会给出"已弃用"的提示，功能照常可用。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blog.darkrich.com;

    # 本域名单独签发的证书(certbot 默认路径)，签发步骤见文件头部。
    # 没有 include 服务器上的 portfolio-ssl.conf：它的内容我没看过，
    # 若其中已设置 ssl_protocols 等指令，与下面重复会导致 nginx -t 报 duplicate 错误。
    ssl_certificate     /etc/letsencrypt/live/blog.darkrich.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.darkrich.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 静态文件根目录，必须等于 Jenkins 参数 DEPLOY_DIR + /current
    root /var/www/blog-frontend/current;
    index index.html;

    # 基础安全响应头。API 响应的 X-Frame-Options 由后端自己设置
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ---- API 反向代理 ----
    location /api/ {
        # 端口必须等于后端部署时的 BLOG_API_PORT（默认 18086，已在 VPS 上确认空闲）。
        # 没有 include 服务器上的 portfolio-proxy.conf：这段配置的 X-Forwarded-For 必须是【覆盖】，
        # 而别处的通用片段通常是【追加】，追加会让登录限流被伪造的请求头绕过。
        proxy_pass http://127.0.0.1:18086;

        # 必须透传原始 Host(含端口)：后端的 SameOriginFilter 会拿它和浏览器发来的 Origin 比对，
        # 用 $host(不带端口)或默认的 127.0.0.1:端口 都会让后台所有写操作被判成跨站而返回 403
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # 用 $remote_addr【覆盖】而不是 $proxy_add_x_forwarded_for【追加】：
        # 追加会把客户端自己伪造的 X-Forwarded-For 一并带给后端，攻击者可借此绕过按 IP 的登录限流
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 后台批量导入 Markdown 最多 60MB（与后端 multipart.max-request-size 一致），默认 1MB 会在到达后端前就被拒绝
        client_max_body_size 60m;
        proxy_read_timeout 60s;
    }

    # ---- 静态资源缓存 ----
    # Vite 产出的 /assets 下文件名带内容哈希：内容变化文件名必变，可以放心长期缓存。
    # 只写一个 Cache-Control(不叠加 expires)：expires 会另外生成一个 max-age 头，响应里就有两个 Cache-Control。
    # 注意 Nginx 的坑：location 里只要出现 add_header，就【不再继承】server 级的 add_header，
    # 所以这里要把需要的安全头重写一遍。静态脚本/样式不涉及页面嵌套和来源策略，只需 nosniff。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 入口页不能被缓存：它引用具体哪个哈希的 js，缓存了就会一直加载旧版本。
    # 刻意用 expires -1(输出 Cache-Control: no-cache)而不是 add_header：
    # 这样本 location 里没有 add_header，才能继承 server 级的 X-Frame-Options / Referrer-Policy 等安全头。
    # SPA 回退(try_files 落到 /index.html)会内部重定向到这里，所以所有前端路由的页面都走这个 location。
    location = /index.html {
        expires -1;
    }

    # 单页应用回退：/articles/xxx、/resume、/admin/... 这些前端路由在磁盘上没有对应文件，统一交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
